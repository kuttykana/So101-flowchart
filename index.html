<title>SO-101 Pick-and-Place Workflow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a swimlane engineering chart with a sticky inspector beside it. */
:root{
  --bg:#f2f4f7;--surface:#ffffff;--band:#e8ecf1;--band2:#edf0f4;--rail:#dde3ea;
  --ink:#16212c;--mute:#566474;--line:#7c8c9c;
  --off:#2450a6;--off-soft:#e4ebfa;--rt:#0a6d60;--rt-soft:#dbf0ec;--lead:#9c500d;--lead-soft:#f8e9d9;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161c;--surface:#1a232c;--band:#161e26;--band2:#19222b;--rail:#222d38;
  --ink:#e6ecf2;--mute:#9dabb9;--line:#74869a;
  --off:#8dadef;--off-soft:#1e2c4a;--rt:#62d2bf;--rt-soft:#12332e;--lead:#eba765;--lead-soft:#3a2a18;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c;--surface:#1a232c;--band:#161e26;--band2:#19222b;--rail:#222d38;
  --ink:#e6ecf2;--mute:#9dabb9;--line:#74869a;
  --off:#8dadef;--off-soft:#1e2c4a;--rt:#62d2bf;--rt-soft:#12332e;--lead:#eba765;--lead-soft:#3a2a18;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans)}
.wrap{max-width:1500px;margin:0 auto;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.04em;color:var(--mute)}
h1{margin:2px 0 4px;font-size:clamp(23px,3vw,30px);line-height:1.2;font-weight:600;text-wrap:balance}
header p{margin:0;color:var(--mute);max-width:68ch}
.tools{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end}
.group{display:grid;gap:4px;min-width:0}
.group>span{font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.btns{display:flex;flex-wrap:wrap;gap:4px}
button{font:500 13.5px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer}
button:hover{background:var(--band)}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,.node:focus-visible,.railbtn:focus-visible{outline:2px solid var(--off);outline-offset:2px}
#status{font:500 12.5px var(--mono);color:var(--mute);min-height:1.5em;font-variant-numeric:tabular-nums}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.scroller{overflow-x:auto;background:var(--surface);border:1px solid var(--rail);min-width:0}
svg#chart{display:block;width:100%;min-width:900px;height:auto}
aside{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);padding:16px;display:grid;gap:10px;min-width:0}
aside h2{margin:0;font-size:20px;line-height:1.25;font-weight:600;text-wrap:balance}
aside p{margin:0;max-width:60ch}
aside h3{margin:4px 0 0;font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{font-size:13px;padding:4px 8px;text-align:left}
.stages{display:grid;gap:4px}
.stages button{text-align:left;display:flex;gap:8px}
.stages b{font:500 13px var(--mono);color:var(--mute)}
.warn{border-left:3px solid var(--lead);padding-left:8px;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mute);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:30px;height:18px;flex:none}
.legend svg *{fill:var(--surface);stroke:var(--line);stroke-width:1.5}

/* chart */
.bandA{fill:var(--band)}.bandB{fill:var(--band2)}
.railbg{fill:var(--rail)}
.railbtn{cursor:pointer}
.railbtn:hover .railbg{fill:var(--line);fill-opacity:.35}
.rnum{font:500 13px var(--mono);fill:var(--mute)}
.rname{font:600 14.5px var(--sans);fill:var(--ink)}
.rtag{font:500 10.5px var(--mono);letter-spacing:.04em}
.node{cursor:pointer;transition:opacity .2s}
.node .sh{fill:var(--surface);stroke:var(--line);stroke-width:1.6;transition:stroke-width .15s}
.node:hover .sh{stroke-width:2.8}
.node text{pointer-events:none}
.t{font:600 15px var(--sans);fill:var(--ink);text-anchor:middle}
.s{font:400 12.5px var(--sans);fill:var(--mute);text-anchor:middle}
.g{fill:none;stroke:var(--mute);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.c-lead .sh{fill:var(--lead-soft);stroke:var(--lead)}.c-lead .g{stroke:var(--lead)}
.c-off .sh{fill:var(--off-soft);stroke:var(--off)}
.c-rt .sh{fill:var(--rt-soft);stroke:var(--rt)}.c-rt .g{stroke:var(--rt)}
.c-note .sh{fill:none;stroke-dasharray:5 4}
.node.sel .sh{stroke:var(--ink);stroke-width:3.4}
.node.dim{opacity:.18}
.edge{fill:none;stroke:var(--line);stroke-width:1.7;transition:opacity .2s}
.edge.fb{stroke:var(--rt);stroke-width:2.2}
.edge.on{stroke:var(--ink);stroke-width:2.5}
.edge.dim{opacity:.1}
.edge.flow{stroke-dasharray:8 6;animation:flow .8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.lab{font:500 12px var(--sans);fill:var(--mute);paint-order:stroke;stroke:var(--surface);stroke-width:0;transition:opacity .2s}
.lab.dim{opacity:.15}
.note{font:500 12.5px var(--sans);fill:var(--mute);text-anchor:middle}
.note.strong{fill:var(--rt);font-weight:600;font-size:14px}
.split{font:500 11.5px var(--mono);fill:var(--mute)}
.mk{fill:var(--line)}.mkf{fill:var(--rt)}.mko{fill:var(--ink)}
#packet{fill:var(--lead);stroke:var(--surface);stroke-width:2}
@media (max-width:980px){
  .main{grid-template-columns:minmax(0,1fr)}
  aside{position:sticky;top:auto;bottom:0;max-height:38vh;box-shadow:0 -4px 14px rgba(0,0,0,.14)}
}
@media (prefers-reduced-motion:reduce){.edge.flow{animation:none;stroke-dasharray:none}.node,.edge,.lab{transition:none}}
</style>

function anchor(n,side){
 const skew=n.sh==='p'?16:0;
 if(side==='t')return[n.x,n.y-n.h/2];
 if(side==='b')return[n.x,n.y+n.h/2];
 if(side==='l')return[n.x-n.w/2+skew/2,n.y];
 return[n.x+n.w/2-skew/2,n.y];
}
function points(e){
 if(e.pts)return e.pts;
 const a=byId[e.f],b=byId[e.t];
 if(a.x===b.x)return a.y<b.y?[anchor(a,'b'),anchor(b,'t')]:[anchor(a,'t'),anchor(b,'b')];
 return a.x<b.x?[anchor(a,'r'),anchor(b,'l')]:[anchor(a,'l'),anchor(b,'r')];
}
function shape(n,g){
 const{w,h}=n,L=-w/2,R=w/2,T=-h/2,B=h/2;
 if(n.sh==='p')return mk('path',{class:'sh',d:`M${L+16} ${T}H${R}L${R-16} ${B}H${L}Z`},g);
 if(n.sh==='d')return mk('path',{class:'sh',d:`M0 ${T}L${R} 0L0 ${B}L${L} 0Z`},g);
 if(n.sh==='c')return mk('path',{class:'sh',d:`M${L} ${T+10}V${B-10}C${L} ${B+3} ${R} ${B+3} ${R} ${B-10}V${T+10}C${R} ${T-3} ${L} ${T-3} ${L} ${T+10}C${L} ${T+23} ${R} ${T+23} ${R} ${T+10}`},g);
 return mk('rect',{class:'sh',x:L,y:T,width:w,height:h,rx:n.sh==='e'?h/2:n.sh==='n'?0:3},g);
}

 leader:'M-14 -16H-6M-10 -16L-5 -28L5 -24L12 -32M12 -32m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0',
 follower:'M-14 -16H-6M-10 -16L-5 -28L5 -24L10 -30M10 -30L15 -33M10 -30L15 -26',
 watch:'M-5 -35H5L4 -30M-5 -35L-4 -30M-4 -19L-5 -14H5L4 -19M-6 -24.5a6 6 0 1 0 12 0a6 6 0 1 0 -12 0',
 cam:'M-11 -31H11V-17H-11ZM-4 -24a4 4 0 1 0 8 0a4 4 0 1 0 -8 0'
};
function draw(){
 const defs=mk('defs');
 [['arrow','mk'],['arrowF','mkf'],['arrowO','mko']].forEach(([id,c])=>{
  const m=mk('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse',markerUnits:'userSpaceOnUse'},defs);
  m.setAttribute('markerWidth',9);m.setAttribute('markerHeight',9);
  mk('path',{d:'M0 0L10 5L0 10Z',class:c},m);
 });
 STAGES.forEach((b,i)=>{
  mk('rect',{class:i%2?'bandB':'bandA',x:RX,y:b.y,width:1050,height:b.h});
  const g=mk('g',{class:'railbtn',tabindex:0,role:'button','aria-label':`Stage ${b.n}: ${b.name.join(' ')}`,'data-stage':b.n});
  mk('rect',{class:'railbg',x:0,y:b.y,width:RX-4,height:b.h},g);
  mk('text',{class:'rnum',x:12,y:b.y+24},g).textContent=b.n<6?`STAGE ${b.n}`:'FINAL';
  b.name.forEach((l,j)=>mk('text',{class:'rname',x:12,y:b.y+46+j*18},g).textContent=l);
  const c=b.tag==='OFFLINE'?'var(--off)':b.tag==='REAL TIME'?'var(--rt)':'var(--mute)';
  mk('text',{class:'rtag',x:12,y:b.y+52+b.name.length*18,fill:c},g).textContent=b.tag;
 });
 mk('text',{class:'split',x:RX+14,y:961}).textContent='Offline pipeline above. Real-time pipeline below.';
 const root=mk('g',{transform:`translate(${RX} 0)`});
 E.forEach(e=>{
  const p=points(e);
  e.el=mk('path',{class:'edge'+(e.fb?' fb':''),d:'M'+p.map(q=>q.join(' ')).join('L'),'marker-end':e.fb?'url(#arrowF)':'url(#arrow)'},root);
  if(e.lab){e.labEl=mk('text',{class:'lab',x:e.lx,y:e.ly},root);e.labEl.textContent=e.lab}
 });
 mk('text',{class:'note',x:820,y:356},root).textContent='Recorded simultaneously';
 mk('text',{class:'note strong',x:430,y:1255},root).textContent='Observe, predict, execute. Repeat.';
 mk('text',{class:'note',x:430,y:1277},root).textContent='No leader arm. No teleoperation.';
 N.forEach(n=>{
  const g=mk('g',{class:'node'+(n.c?' c-'+n.c:''),transform:`translate(${n.x} ${n.y})`,tabindex:0,role:'button','aria-label':label(n)+(n.s?', '+n.s:''),'data-id':n.id},root);
  n.el=g;shape(n,g);
  if(n.g)mk('path',{class:'g',d:GLYPH[n.g]},g);
  const lines=n.t.length+(n.s?1:0)+(n.s2?n.s2.length:0);
  let y=(n.g?22:0)+(n.g?-8:-(lines-1)*9+5);
  n.t.forEach(l=>{mk('text',{class:'t',y},g).textContent=l;y+=18});
  if(n.s){mk('text',{class:'s',y:y-1},g).textContent=n.s;y+=18}
  (n.s2||[]).forEach(l=>{mk('text',{class:'s',y:y-1},g).textContent=l;y+=16});
 });
 st.packet=mk('circle',{id:'packet',r:7,visibility:'hidden'},root);
}
function neighbours(id){
 const s=new Set([id]);E.forEach(e=>{if(e.f===id)s.add(e.t);if(e.t===id)s.add(e.f)});return s;
}
function apply(){
 const v=VIEWS.find(x=>x.id===st.view),sig=SIG[st.sig].ids?new Set(SIG[st.sig].ids.split(' ')):null;
 let base=new Set(N.filter(n=>(!v.set||v.set(n))&&(!sig||sig.has(n.id))).map(n=>n.id));
 const walking=st.i>=0;
 let focus=null;
 if(st.sel&&!walking)focus=neighbours(st.sel);
 else if(st.stage)focus=new Set(N.filter(n=>n.st===st.stage).map(n=>n.id));
 N.forEach(n=>{
  const lit=focus?focus.has(n.id):base.has(n.id);
  n.el.classList.toggle('dim',!lit);
  n.el.classList.toggle('sel',n.id===st.sel);
  n.el.setAttribute('aria-pressed',n.id===st.sel);
 });
 E.forEach(e=>{
  let lit,on=false;
  if(focus&&st.sel){lit=e.f===st.sel||e.t===st.sel;on=lit}
  else if(focus)lit=focus.has(e.f)&&focus.has(e.t);
  else{lit=base.has(e.f)&&base.has(e.t);on=!!sig&&lit}
  e.el.classList.toggle('dim',!lit);
  e.el.classList.toggle('on',on);
  e.el.classList.toggle('flow',!!sig&&lit&&!focus);
  e.el.setAttribute('marker-end',on?'url(#arrowO)':e.fb?'url(#arrowF)':'url(#arrow)');
  if(e.labEl)e.labEl.classList.toggle('dim',!lit);
 });
 document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.view));
 document.querySelectorAll('#signals button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===st.sig));
 renderPanel();
}
function renderStatus(){
 if(st.i<0){status.textContent='';return}
 if(st.seq===LOOP){
  const c=Math.min(3,Math.floor(st.i/CYCLE.length)+1);
  status.textContent=st.i===LOOP.length-1?'Example run finished after 3 cycles. Real cycle counts vary.':`Control loop, cycle ${c} of 3 in this example run`;
 }else status.textContent=`Step ${st.i+1} of ${FULL.length}`;
}
function chip(id,txt){return `<button type="button" data-go="${id}">${txt||label(byId[id])}</button>`}
function renderPanel(){
 if(st.sel){
  const n=byId[st.sel],b=STAGES[n.st-1];
  const inc=E.filter(e=>e.t===n.id).map(e=>e.f),out=E.filter(e=>e.f===n.id).map(e=>e.t);
  const kind={r:'Process',p:'Input or output',c:'Dataset',d:'Decision',n:'Note',e:'End point'}[n.sh];
  const hw={s_leader:1,s_follower:1,s_titan:1}[n.id]?'Hardware':kind;
  panel.innerHTML=`<div class="eyebrow">${b.n<6?'Stage '+b.n:'Final'} · ${b.name.join(' ')} · ${hw}</div>
   <h2>${label(n)}</h2>${n.s?`<p style="color:var(--mute)">${n.s}</p>`:''}<p>${n.d}</p>
   ${n.warn?`<p class="warn">${n.warn}</p>`:''}
   ${inc.length?`<h3>Comes from</h3><div class="chips">${inc.map(i=>chip(i)).join('')}</div>`:''}
   ${out.length?`<h3>Goes to</h3><div class="chips">${out.map(i=>chip(i)).join('')}</div>`:''}
   ${n.same?`<h3>${n.sameL}</h3><div class="chips">${chip(n.same)}</div>`:''}
   <div class="chips"><button type="button" data-clear="1">Back to overview</button></div>`;
 }else if(st.stage){
  const b=STAGES[st.stage-1];
  panel.innerHTML=`<div class="eyebrow">${b.n<6?'Stage '+b.n:'Final'} · ${b.tag}</div><h2>${b.name.join(' ')}</h2><p>${b.text}</p>
   <h3>Blocks</h3><div class="chips">${N.filter(n=>n.st===b.n).map(n=>chip(n.id)).join('')}</div>
   <div class="chips"><button type="button" data-clear="1">Back to overview</button></div>`;
 }else{
  panel.innerHTML=`<div class="eyebrow">Overview</div><h2>From demonstration to autonomy</h2>
   <p>A person teaches the task through the leader arm. ACT learns from those recordings. The follower arm then repeats the task alone.</p>
   <p style="color:var(--mute)">Inputs to the policy are two camera views and the joint state. Output is a chunk of robot actions.</p>
   <h3>Jump to a stage</h3><div class="stages">${STAGES.map(b=>`<button type="button" data-stage="${b.n}"><b>${b.n<6?b.n:'✓'}</b>${b.name.join(' ')}</button>`).join('')}</div>`;
 }
}
function reveal(id){
 byId[id].el.scrollIntoView({block:'center',inline:'center',behavior:reduce?'auto':'smooth'});
}
function pick(id,scroll){st.sel=id;st.stage=null;apply();if(scroll)reveal(id)}
function stopWalk(){clearTimeout(st.timer);st.playing=false}
function packet(a,b){
 const e=E.find(x=>x.f===a&&x.t===b);
 if(!e||reduce)return;
 const len=e.el.getTotalLength(),start=performance.now(),dur=Math.min(650,250+len),c=st.packet;
 c.setAttribute('visibility','visible');
 (function tick(t){
  const k=Math.min(1,(t-start)/dur),p=e.el.getPointAtLength(len*k);
  c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);
  if(k<1)requestAnimationFrame(tick);else c.setAttribute('visibility','hidden');
 })(start);
}
function goStep(i){
 const prev=st.i>=0?st.seq[st.i]:null;
 st.i=i;const id=st.seq[i];
 st.sel=id;st.stage=null;apply();reveal(id);
 if(prev)packet(prev,id);
}
function run(seq){
 if(st.playing&&st.seq===seq){stopWalk();apply();return}
 stopWalk();
 if(st.seq!==seq||st.i>=seq.length-1)st.i=-1;
 st.seq=seq;st.playing=true;st.view='all';st.sig='none';
 (function tick(){
  if(!st.playing)return;
  if(st.i>=st.seq.length-1){st.playing=false;apply();return}
  goStep(st.i+1);
  st.timer=setTimeout(tick,seq===LOOP?800:1500);
 })();
}
function step(d){
 stopWalk();
 if(st.seq!==FULL){st.seq=FULL;st.i=FULL.indexOf(st.sel)}
 else if(st.i<0&&st.sel)st.i=FULL.indexOf(st.sel);
 goStep(Math.max(0,Math.min(FULL.length-1,st.i+d)));
}
function clearAll(){stopWalk();st.sel=null;st.stage=null;st.i=-1;st.seq=FULL;apply()}

draw();
document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-id],[data-go],[data-clear],[data-stage],[data-v],[data-s]');
 if(!t)return;
 const d=t.dataset;
 if(d.id){stopWalk();st.i=-1;pick(d.id)}
 else if(d.go){stopWalk();st.i=-1;pick(d.go,true)}
 else if(d.clear)clearAll();
 else if(d.stage){stopWalk();st.i=-1;st.sel=null;st.stage=+d.stage;apply()}
 else if(d.v){clearAll();st.view=d.v;st.sig='none';apply()}
 else if(d.s){clearAll();st.sig=d.s;st.view='all';apply()}
});
svg.addEventListener('keydown',ev=>{
 if(ev.key!=='Enter'&&ev.key!==' ')return;
 const t=ev.target.closest('[data-id],[data-stage]');
 if(t){ev.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape')clearAll();
});
apply();
</script>
